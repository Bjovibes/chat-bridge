<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Chat Bridge mark">
  <!-- suspension arc -->
  <path d="M10 38 a22 22 0 0 1 44 0" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <!-- deck -->
  <line x1="6" y1="44" x2="58" y2="44" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <!-- pylons -->
  <line x1="13" y1="47" x2="13" y2="54" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <line x1="51" y1="47" x2="51" y2="54" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  <!-- the conversation: three typing dots inside the arch -->
  <circle cx="24" cy="31" r="3.2" fill="currentColor"/>
  <circle cx="32" cy="31" r="3.2" fill="currentColor"/>
  <circle cx="40" cy="31" r="3.2" fill="currentColor"/>
</svg>
