<!-- WAB v2 people UI, builder B2. Integrator: paste this fragment at the end of body,
     add <link rel="stylesheet" href="people.css"> and <script src="people.js"></script>,
     and place <div id="people-rail"></div> inside the shell rail, above the accounts list.
     people.js init() moves the #people-rail block below into that container. No script or
     link tags live in this fragment on purpose. -->
<div id="wab-people-root">

  <div id="people-rail" class="people-rail" data-wab-people-block>
    <div class="people-head">
      <span class="people-title">People</span>
      <button id="people-search-btn" class="people-search-btn" type="button" title="Search all accounts (Ctrl+K)" aria-label="Search all accounts">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="6" cy="6" r="4.5"/><path d="M9.5 9.5 13 13"/></svg>
      </button>
    </div>
    <input id="people-filter" class="people-filter" type="text" placeholder="Filter people" autocomplete="off" spellcheck="false" aria-label="Filter people">
    <div id="people-list" class="people-list" role="listbox" aria-label="People"></div>
  </div>

  <div id="search-palette" class="people-palette" hidden>
    <div class="people-palette-card" role="dialog" aria-modal="true" aria-label="Search people">
      <div class="people-palette-top">
        <span class="people-palette-glyph" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="6" r="4.5"/><path d="M9.5 9.5 13 13"/></svg>
        </span>
        <input id="palette-input" type="text" placeholder="Search every account" autocomplete="off" spellcheck="false" aria-label="Search people">
        <button id="palette-close" class="people-palette-close" type="button" aria-label="Close search">&times;</button>
      </div>
      <div id="palette-results" class="people-palette-results" role="listbox" aria-label="Search results"></div>
      <div class="people-palette-foot">
        <span>Up and down move</span>
        <span>Enter opens</span>
        <span>Esc closes</span>
      </div>
    </div>
  </div>

</div>
